# Minimal stub of the Flux kustomize-controller Kustomization CRD. The
# milestone-operator only ever reads the parent's apiVersion/kind and writes
# the reconcile.fluxcd.io/requestedAt annotation on it; no other field is
# touched, so x-kubernetes-preserve-unknown-fields on spec is sufficient.
# A status subresource is exposed because controller-runtime's dynamic
# clients refuse to patch an object without a status subresource when the
# Patch path includes status — although the notifier writes an annotation
# only, future patches may need it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kustomizations.kustomize.toolkit.fluxcd.io
spec:
  group: kustomize.toolkit.fluxcd.io
  scope: Namespaced
  names:
    plural: kustomizations
    singular: kustomization
    kind: Kustomization
    listKind: KustomizationList
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
