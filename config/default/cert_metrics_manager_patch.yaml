# Promotes the metrics endpoint from plain HTTP (the default) to HTTPS with
# cert-manager-managed certificates. Apply via kustomize by uncommenting the
# `cert_metrics_manager_patch.yaml` entry in config/default/kustomization.yaml
# alongside the cert-manager resources, the metrics_service_tls_patch.yaml,
# and config/prometheus/monitor_tls_patch.yaml.

# Replace the plain-HTTP bind-address baseline from manager_metrics_patch.yaml.
- op: replace
  path: /spec/template/spec/containers/0/args/0
  value: --metrics-bind-address=:8443
- op: replace
  path: /spec/template/spec/containers/0/args/1
  value: --metrics-secure=true

# Mount the cert-manager-issued certs at /tmp/k8s-metrics-server/metrics-certs.
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    mountPath: /tmp/k8s-metrics-server/metrics-certs
    name: metrics-certs
    readOnly: true

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --metrics-cert-path=/tmp/k8s-metrics-server/metrics-certs

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: metrics-certs
    secret:
      secretName: metrics-server-cert
      optional: false
      items:
        - key: ca.crt
          path: ca.crt
        - key: tls.crt
          path: tls.crt
        - key: tls.key
          path: tls.key
