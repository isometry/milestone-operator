# Sample ClusterRole granting the operator's dynamic informers list/watch
# access to common GitOps resource kinds. Bound separately so cluster
# administrators can replace it with a narrower role for restricted
# environments.
#
# Rule of thumb: every group/kind that may appear under
# spec.dependsOn[].target.group/kind must be reachable by these rules. Add
# or remove groups to suit your deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-dynamic-watch-role
  labels:
    app.kubernetes.io/name: milestone-operator
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, helmrepositories, ocirepositories, helmcharts, buckets]
    verbs: [get, list, watch]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagepolicies, imagerepositories, imageupdateautomations]
    verbs: [get, list, watch]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [alerts, providers, receivers]
    verbs: [get, list, watch]
  # Add additional groups (e.g. argoproj.io, cert-manager.io) as needed by
  # binding a separate ClusterRole to this controller's ServiceAccount.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-dynamic-watch-rolebinding
  labels:
    app.kubernetes.io/name: milestone-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-dynamic-watch-role
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: system
