# Aggregation umbrella for the operator's dynamic informers. Its rules are owned
# by the kube-controller-manager, which unions in the rules of every ClusterRole
# labelled `milestone.as-code.io/aggregate-to-dynamic-watch: "true"`. To let the
# operator watch a target group/kind named under spec.dependsOn[].target, create
# (or extend) such a labelled ClusterRole — do NOT add rules to this role, the
# controller-manager would overwrite them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-dynamic-watch-role
  labels:
    app.kubernetes.io/name: milestone-operator
    app.kubernetes.io/component: rbac
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        milestone.as-code.io/aggregate-to-dynamic-watch: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-dynamic-watch-rolebinding
  labels:
    app.kubernetes.io/name: milestone-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-dynamic-watch-role
subjects:
  - kind: ServiceAccount
    name: controller-manager
    namespace: system
---
# Default member role: out-of-the-box list/watch coverage for FluxCD target
# kinds (the operator's primary use case). The aggregation label unions these
# rules into manager-dynamic-watch-role. Grant additional target groups (e.g.
# "" for configmaps, argoproj.io, cert-manager.io) by shipping further
# ClusterRoles carrying the same label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-dynamic-watch-flux
  labels:
    app.kubernetes.io/name: milestone-operator
    app.kubernetes.io/component: rbac
    milestone.as-code.io/aggregate-to-dynamic-watch: "true"
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, helmrepositories, ocirepositories, helmcharts, buckets]
    verbs: [get, list, watch]
  - apiGroups: [image.toolkit.fluxcd.io]
    resources: [imagepolicies, imagerepositories, imageupdateautomations]
    verbs: [get, list, watch]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources: [alerts, providers, receivers]
    verbs: [get, list, watch]
