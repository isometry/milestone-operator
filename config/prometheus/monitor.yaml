# Prometheus Monitor Service (Metrics)
#
# Default install scrapes plain HTTP on :8080. The endpoint is still gated by
# bearer-token authentication via the WithAuthenticationAndAuthorization
# filter when --metrics-secure=true is set on the manager; here we scrape
# without TLS so the kustomize default stays portable on clusters that don't
# run cert-manager. Enable TLS by uncommenting monitor_tls_patch in
# config/prometheus/kustomization.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: milestone-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
    - path: /metrics
      port: http
      scheme: http
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: milestone-operator
